plugins { id 'com.android.application' }
android {
 namespace 'pro.creativezone.motionlauncher'
 compileSdk 34
 buildToolsVersion '34.0.0'
 defaultConfig {
  applicationId 'pro.creativezone.motionlauncher'
  minSdk 21
  targetSdk 32
  versionCode 10033
  versionName '1.0.33'
 }
 signingConfigs {
  release {
   def storePath=System.getenv('SIGNING_STORE_FILE')
   if(storePath){
    // Release passwords stay in the machine's private 0600 file; never print or commit them.
    def privatePasswordFile=System.getenv('SIGNING_PASSWORD_FILE')
    def localPassword=privatePasswordFile ? file(privatePasswordFile).getText('UTF-8').trim() : null
    storeFile file(storePath)
    storePassword System.getenv('SIGNING_STORE_PASSWORD') ?: localPassword
    keyAlias System.getenv('SIGNING_KEY_ALIAS')
    keyPassword System.getenv('SIGNING_KEY_PASSWORD') ?: localPassword
   }
  }
 }
 buildTypes {
  debug { minifyEnabled false }
  release { minifyEnabled false; signingConfig signingConfigs.release }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {}
